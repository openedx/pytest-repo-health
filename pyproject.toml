[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-repo-health"
dynamic = ["version"]
description = "A pytest plugin to report on repository standards conformance"
readme = "README.rst"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "edX", email = "oscm@edx.org"},
]
keywords = ["pytest", "edx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "GitPython",
    "github-py @ git+https://github.com/ShineyDev/github.py.git@8e3514010eb35a91e012f2935f48138b3c35cef6",
    "pytest",
    "pytest-aiohttp",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/openedx/pytest-repo-health"

[project.entry-points.pytest11]
plugin = "pytest_repo_health.plugin"

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
include = ["pytest_repo_health*"]
exclude = ["*.tests", "*.tests.*"]

[tool.coverage.run]
branch = true
source = ["pytest_repo_health"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
