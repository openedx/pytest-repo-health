[tox]
requires = tox-uv>=1
envlist = py312, quality

[doc8]
max-line-length = 120

[pytest]
testpaths = pytest_repo_health tests
addopts = -p pytester

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
passenv =
	GITHUB_TOKEN
commands =
	pytest

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = doc
setenv =
	PYTHONPATH = {toxinidir}
allowlist_externals =
	make
	rm
commands =
	doc8 --ignore-path docs/_build README.rst docs
	python -m readme_renderer README.rst -o /dev/null
	rm -f docs/modules.rst
	make -C docs clean
	make -C docs html

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
	pylint pytest_repo_health
