name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: ['**']
  workflow_call:

jobs:
  tests:
    name: ${{ matrix.toxenv }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']
        toxenv: ['py', 'quality']
    permissions:
      contents: read

    steps:
    - name: checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install CI dependencies
      run: uv sync --group ci --locked

    - name: Run Tests
      run: uv run --locked tox -e ${{ matrix.toxenv }}
